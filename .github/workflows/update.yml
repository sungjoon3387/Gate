
name: Gate 데이터 갱신
on: {schedule: [{cron: '20 20 * * 1-5'}, {cron: '15 21 * * 1-5'}], workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 collect.py
      - run: git config user.name gate-bot && git config user.email gate-bot@users.noreply.github.com && git add data.json tranches.json && (git diff --staged --quiet || git commit -m "데이터 갱신") && git push
